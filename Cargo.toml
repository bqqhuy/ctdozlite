[package]
name = "ctdozlite"
version = "0.0.16"
edition = "2021"
authors = ["TIPC1110 <tienichpc1110@gmail.com>"]
description = "Native Zalo client for Windows 11 ARM64"
homepage = "https://github.com/bqqhuy/ctdozlite"
repository = "https://github.com/bqqhuy/ctdozlite"
license = "MIT OR Apache-2.0"
default-run = "ctdozlite"

[dependencies]
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
md-5 = "0.10"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls", "stream", "socks"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "fs"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
tokio-socks = "0.5"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
aes-gcm = "0.10"
flate2 = "1"
generic-array = "0.14"
anyhow = "1"
qrcode = { version = "0.14.1", default-features = false }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
ratatui = "0.29"
crossterm = "0.28"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
cpal = "0.15"
opus = "0.3"
wasmi = "0.40"
zstd = "0.14.3"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
rand_core = "0.10"
unicode-segmentation = "1.13"
tar = { version = "0.4", default-features = false }
tempfile = "3"
jxl-oxide = { version = "0.12.6", default-features = false }
lzma-rust2 = { version = "0.25.0", default-features = false, features = ["std", "xz"] }
aws-lc-rs = "1.19.0"

# Signal Protocol — E2EE Double Ratchet (WP16-1/2)
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "3.0.0", features = ["zeroize"] }
hkdf = "0.12"
hmac = "0.12"

# --- Windows ARM64 tuning -------------------------------------------------
# Windows on ARM (Snapdragon) has no guaranteed native OpenGL driver: older
# devices fall back to the "OpenGL Compatibility Pack" (GL-on-DX12 emulation)
# or have nothing at all. Add the wgpu backend so the GUI renders through
# Direct3D 12 natively; `glow` stays compiled in as a runtime fallback.
[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wgpu"] }
# eframe disables wgpu defaults and does not enable DX12 itself. Selecting DX12
# at runtime cannot create a surface unless its implementation is compiled in.
wgpu = { version = "22.1", default-features = false, features = ["dx12", "wgsl"] }

# Native Win32 IFileOpenDialog instead of spawning PowerShell + WinForms
# (PowerShell cold start is 1–3 s and is emulated x64 on some ARM images).
[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }
tray-icon = { version = "0.21", default-features = false }
raw-window-handle = "0.6"
windows = { version = "0.54", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_System_Kernel", "Security_Credentials_UI"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "unwind"

[lib]
name = "zalo_rust"
path = "src/lib.rs"

[[bin]]
name = "ctdozlite"
path = "src/main.rs"

[patch.crates-io]
lru = { path = "vendor/lru-compat" }

tray-icon = { path = "vendor/tray-icon" }

# E2EE integration helper
