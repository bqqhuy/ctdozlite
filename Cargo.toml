[package]
name = "ctdozlite"
version = "0.0.1"
edition = "2021"
authors = ["TIPC1110 <tienichpc1110@gmail.com>"]
description = "Native Zalo client for Windows 11 ARM64"
homepage = "https://github.com/bqqhuy/ctdozlite"
repository = "https://github.com/bqqhuy/ctdozlite"
license = "MIT OR Apache-2.0"
default-run = "zalo-rust"

[dependencies]
aes = "0.8"
cbc = "0.1"
cipher = "0.4"
md-5 = "0.10"
sha2 = "0.10"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
aes-gcm = "0.10"
flate2 = "1"
generic-array = "0.14"
anyhow = "1"
qrcode = { version = "0.14.1", default-features = false }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ratatui = "0.29"
crossterm = "0.28"
rusqlite = { version = "0.32", features = ["bundled"] }
cpal = "0.15"
opus = "0.3"

# --- Windows ARM64 tuning -------------------------------------------------
# Windows on ARM (Snapdragon) has no guaranteed native OpenGL driver: older
# devices fall back to the "OpenGL Compatibility Pack" (GL-on-DX12 emulation)
# or have nothing at all. Add the wgpu backend so the GUI renders through
# Direct3D 12 natively; `glow` stays compiled in as a runtime fallback.
[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wgpu"] }

# Native Win32 IFileOpenDialog instead of spawning PowerShell + WinForms
# (PowerShell cold start is 1–3 s and is emulated x64 on some ARM images).
[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }
windows = { version = "0.54", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
panic = "unwind"

[lib]
name = "zalo_rust"
path = "src/lib.rs"

[[bin]]
name = "zalo-rust"
path = "src/main.rs"
