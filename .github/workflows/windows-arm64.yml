name: Windows ARM64 (native build)

on:
  workflow_dispatch:
    inputs:
      experimental_e2ee:
        description: Build an opt-in E2EE trial artifact (never publish)
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: windows-arm64-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/') }}

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  windows-arm64:
    # This custom release reuses the verified c886171 artifact instead of rebuilding it.
    if: github.ref != 'refs/tags/v0.002-arm'
    name: Windows 11 ARM64 (.exe)
    runs-on: windows-11-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned native Rust
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
            .\rustup-init.exe -y --profile minimal --default-host aarch64-pc-windows-msvc --default-toolchain 1.99.1
            if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
            "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          } else {
            rustup set default-host aarch64-pc-windows-msvc
            rustup toolchain install 1.99.1-aarch64-pc-windows-msvc --profile minimal
            if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed' }
          }
      - name: Prepare build and packaging tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            choco install llvm -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'LLVM installation failed' }
            'C:\Program Files\LLVM\bin' | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            choco install cmake -y --no-progress --installargs 'ADD_CMAKE_TO_PATH=System'
            if ($LASTEXITCODE -ne 0) { throw 'CMake installation failed' }
            'C:\Program Files\CMake\bin' | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --version=6.7.1 -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
            'C:\Program Files (x86)\Inno Setup 6' | Out-File -FilePath $env:GITHUB_PATH -Append
          }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: windows-arm64-1.99.1
          save-if: 'true'
          cache-on-failure: true
      - name: Tests, native PE smoke check and package
        shell: pwsh
        run: |
          $trial = '${{ inputs.experimental_e2ee }}' -eq 'true'
          ./scripts/build-windows-arm64.ps1 -ExperimentalE2ee:$trial
      - name: Print cargo test log on failure
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path dist/cargo-test.log) {
            Get-Content dist/cargo-test.log -Tail 150
          }
      - name: Upload renderer diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-arm64-renderer-diagnostics
          path: |
            dist/*.log
            dist/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ctdozlite-windows-arm64${{ inputs.experimental_e2ee && '-trial' || '' }}
          path: dist/*
          if-no-files-found: error
  publish:
    name: Attach ARM64 binaries and checksums
    needs: windows-arm64
    if: startsWith(github.ref, 'refs/tags/') && github.event_name != 'pull_request' && inputs.experimental_e2ee != true
    runs-on: windows-11-arm
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ctdozlite-windows-arm64
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/SHA256SUMS-windows-arm64.txt
            dist/build-info-windows-arm64.json
            dist/THIRD_PARTY_NOTICES.txt
            dist/LICENSE-MIT
            dist/LICENSE-APACHE
